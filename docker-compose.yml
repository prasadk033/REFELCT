services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID:-873884087071-6bvmorueu2ldkr4auttmso74m4vl211o.apps.googleusercontent.com}
        - VITE_API_BASE=${VITE_API_BASE:-}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "5173:80"
    volumes:
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./certbot/www:/var/www/certbot:ro
    restart: unless-stopped
    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - DATABASE_URL=${DATABASE_URL:-postgresql://${POSTGRES_USER:-litellm}:${POSTGRES_PASSWORD:-LiteLLMPostgres2026}@postgres:5432/${POSTGRES_DB:-litellm}}
      - APP_DATABASE_URL=${APP_DATABASE_URL:-postgresql://${POSTGRES_USER:-litellm}:${POSTGRES_PASSWORD:-LiteLLMPostgres2026}@postgres:5432/${REFLECT_DB_NAME:-reflect}}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-http://minio:9000}
    volumes:
      - ./uploads:/app/uploads
      - ./backend:/app/backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      litellm:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: python worker.py
    env_file:
      - .env
    environment:
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - DATABASE_URL=${DATABASE_URL:-postgresql://${POSTGRES_USER:-litellm}:${POSTGRES_PASSWORD:-LiteLLMPostgres2026}@postgres:5432/${POSTGRES_DB:-litellm}}
      - APP_DATABASE_URL=${APP_DATABASE_URL:-postgresql://${POSTGRES_USER:-litellm}:${POSTGRES_PASSWORD:-LiteLLMPostgres2026}@postgres:5432/${REFLECT_DB_NAME:-reflect}}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-http://minio:9000}
    volumes:
      - ./uploads:/app/uploads
      - ./backend:/app/backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      litellm:
        condition: service_started

  litellm:
    image: ghcr.io/berriai/litellm:main-v1.40.0
    env_file:
      - .env
    volumes:
      - ./litellm_config.yaml:/app/litellm_config.yaml
    command: [ "--config", "/app/litellm_config.yaml", "--port", "4000" ]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    ports:
      # Bound to loopback interface to prevent unauthorized external access
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --loglevel warning
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-litellm}
      POSTGRES_USER: ${POSTGRES_USER:-litellm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-LiteLLMPostgres2026}
      REFLECT_DB_USER: ${REFLECT_DB_USER:-reflect}
      REFLECT_DB_PASSWORD: ${REFLECT_DB_PASSWORD:-ReflectPostgres2026}
      REFLECT_DB_NAME: ${REFLECT_DB_NAME:-reflect}
    ports:
      # Bound to loopback interface to prevent external database scans
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-litellm} -d $${POSTGRES_DB:-litellm}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    ports:
      - "127.0.0.1:9000:9000"   # S3 API loopback only
      - "9001:9001"              # Web Console
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-reflect-minio-access}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-reflect-minio-secret-2026}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # MinIO bucket initialisation — runs once on first startup
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-reflect-minio-access}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-reflect-minio-secret-2026}
      MINIO_BUCKET: ${MINIO_BUCKET:-reflect-uploads}
    entrypoint: >
      /bin/sh -c "
        sleep 5;
        mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
        mc mb --ignore-existing local/$${MINIO_BUCKET};
        mc anonymous set none local/$${MINIO_BUCKET};
        echo 'MinIO bucket ready.';
        exit 0;
      "
    restart: "no"

  # pgAdmin Web UI
  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@reflect.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-pgAdminSecure2026}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  redis_data:
  postgres_data:
  minio_data:
  pgadmin_data:
